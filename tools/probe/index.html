<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>CytProbe</title>
<style>body{margin:0;padding:32px;background:#111;color:#eee;font:16px/1.3 monospace}
button{font:inherit;margin:4px;padding:6px 12px}#status{font-weight:bold;color:#fd5;margin:8px 0}button:focus{outline:4px solid #5af}
pre{white-space:pre-wrap;word-break:break-all}</style></head>
<body><div id="actions"></div><div id="status">Chưa mở ứng dụng nào.</div><pre id="out">Đang thăm dò…</pre>
<script src="probe.js"></script>
<script>
(function () {
  var status = document.getElementById('status'), out = document.getElementById('out'), actions = document.getElementById('actions');
  CytProbe.run({tizen: window.tizen, webapis: window.webapis, b2bapis: window.b2bapis}, function (results) {
    out.textContent = results.map(function (r) { return r.status + ' ' + r.name + ': ' + r.detail; }).join('\n');
    console.log('CYTPROBE ' + JSON.stringify(results));
  });
  CytProbe.actions().forEach(function (action) {
    var b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = function () {
      status.textContent = 'Đang thử ' + action.label + '…';
      CytProbe.perform(action, window.tizen, function (text) { status.textContent = text; });
    };
    actions.appendChild(b);
  });
  document.addEventListener('keydown', function (e) {
    var buttons = Array.prototype.slice.call(actions.querySelectorAll('button'));
    var at = buttons.indexOf(document.activeElement);
    var to = CytProbe.nextIndex(buttons.length, at < 0 ? 0 : at, e.key);
    if (to !== at && buttons[to] && /^Arrow/.test(e.key)) buttons[to].focus();
    if (e.key === 'Enter' && document.activeElement && document.activeElement.click) document.activeElement.click();
    if (e.key === 'Escape' || e.keyCode === 10009) {
      try { window.tizen.application.getCurrentApplication().exit(); } catch (x) {}
    }
  });
  var first = actions.querySelector('button');
  if (first) first.focus();
}());
</script></body></html>
